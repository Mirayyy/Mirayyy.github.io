<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to DeltaOps</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222222;
    }

    main {
      max-width: 42rem;
      margin: 10vh auto;
      padding: 1.5rem;
      background: #ffffff;
      border: 1px solid #dddddd;
      border-radius: 0.5rem;
    }

    a {
      color: #0057b8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting to DeltaOps</h1>
    <p id="status">Preparing redirect...</p>
    <p>
      If nothing happens, open
      <a id="target-link" href="/DeltaOps/">/DeltaOps/</a>.
    </p>
    <noscript>
      <p>JavaScript is required to preserve the requested path, query, and hash.</p>
    </noscript>
  </main>
  <script>
    (function () {
      var basePath = "/DeltaOps";
      var pathname = window.location.pathname || "/";
      var search = window.location.search || "";
      var hash = window.location.hash || "";
      var status = document.getElementById("status");
      var targetLink = document.getElementById("target-link");
      var isProjectPath = pathname === basePath || pathname.indexOf(basePath + "/") === 0;
      var suffix = pathname === "/" ? "/" : pathname;
      var target = basePath + suffix + search + hash;

      if (isProjectPath) {
        status.textContent = "Already under /DeltaOps/. No redirect was applied.";
        targetLink.href = basePath + "/";
        targetLink.textContent = basePath + "/";
        return;
      }

      status.textContent = "Redirecting to " + target;
      targetLink.href = target;
      targetLink.textContent = target;
      window.location.replace(target);
    }());
  </script>
</body>
</html>
